spring:
  application:
    name: monitor-admin

  config:
    import: configserver:http://localhost:8888

  cloud:
    config:
      fail-fast: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  boot:
    admin:
      notify:
        mail:
          enabled: true
          to: thanhquyfu@gmail.com