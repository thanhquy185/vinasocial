server:
  port: 8085

spring:
  mongodb:
    uri: mongodb://localhost:27017/vinasocial

logging:
  level:
    io.mongock: DEBUG

mongock:
  enabled: true
  migration-scan-package:
    - vn.tuhoc.MediaService.migrations

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}