<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout('Đặt lại mật khẩu', ~{::emailContent})}">
<body>
    <th:block th:fragment="emailContent">
        <th:block th:replace="~{email-fragments :: greeting(${firstName}, ${lastName}, ${email})}"></th:block>
        <p class="text">
            Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản VinaSocial của bạn.
            Vui lòng sử dụng mã OTP bên dưới để xác minh danh tính và tiếp tục.
        </p>
        <th:block th:replace="~{email-fragments :: otpBlock('Mã xác thực', ${code}, ${expiredAt})}"></th:block>
        <p class="text">
            Sau khi xác minh thành công, bạn sẽ được chuyển đến trang đặt lại mật khẩu để tạo
            mật khẩu mới cho tài khoản của mình.
        </p>
        <th:block th:replace="~{email-fragments :: securityNote('Tuyệt đối không chia sẻ mã OTP này với bất kỳ ai, kể cả nhân viên VinaSocial. Nếu bạn không yêu cầu đặt lại mật khẩu, vui lòng bỏ qua email này. Mật khẩu hiện tại của bạn sẽ không bị thay đổi.')}"></th:block>
    </th:block>
</body>
</html>
