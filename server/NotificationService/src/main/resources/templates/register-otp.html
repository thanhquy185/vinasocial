<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout('Xác minh địa chỉ Email', ~{::emailContent})}">
<body>
    <th:block th:fragment="emailContent">
        <th:block th:replace="~{email-fragments :: greeting(${firstName}, ${lastName}, ${email})}"></th:block>
        <p class="text">
            Cảm ơn bạn đã đăng ký tài khoản tại VinaSocial. Để hoàn tất quá trình đăng ký,
            vui lòng nhập mã OTP bên dưới vào ứng dụng.
        </p>
        <th:block th:replace="~{email-fragments :: otpBlock('Mã xác thực của bạn', ${code}, ${expiredAt})}"></th:block>
        <th:block th:replace="~{email-fragments :: securityNote('Tuyệt đối không chia sẻ mã này với bất kỳ ai, kể cả nhân viên VinaSocial. Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email.')}"></th:block>
    </th:block>
</body>
</html>
